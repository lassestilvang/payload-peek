<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <!-- Emerald / Mint Glow -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Violet / Cyan Flow -->
    <linearGradient id="flowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Inner Ring Glow -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Webhook Node & Typeflow Loop -->
  <g filter="url(#glow)">
    <!-- Main incoming flow curve -->
    <path
      d="M 34 82 C 34 50, 60 40, 78 40 C 94 40, 96 56, 84 66 C 72 76, 52 74, 52 56"
      fill="none"
      stroke="url(#flowGrad)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Interlocking Webhook Root Node -->
    <circle cx="34" cy="84" r="12" fill="#040810" stroke="url(#mintGrad)" stroke-width="6" />
    <circle cx="34" cy="84" r="5" fill="#34d399" />

    <!-- Terminal Code Bracket Peek / Pulse Endpoint -->
    <path
      d="M 88 78 L 98 88 L 88 98"
      fill="none"
      stroke="url(#mintGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 68 88 L 74 88"
      fill="none"
      stroke="#38bdf8"
      stroke-width="6"
      stroke-linecap="round"
    />
  </g>
</svg>
